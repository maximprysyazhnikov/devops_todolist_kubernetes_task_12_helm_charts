namespace: "todo"
serviceAccountName: "todolist-sa"

image:
  repository: "python"
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

# Секрети: генеруються через range і мапляться як env у Deployment
secrets:
  DJANGO_SECRET_KEY: "supersecret"
  DJANGO_DEBUG: "false"
  DB_NAME: "todo"
  DB_USER: "todo_user"
  DB_PASSWORD: "todo_pass"
  DB_HOST: "mysql"   # сервіс підчарту mysql
  DB_PORT: "3306"

# Кількість реплік (HPA масштабує в межах min/max)
replicas: 1

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Параметри RollingUpdate
rollingUpdate:
  maxUnavailable: "25%"
  maxSurge: "25%"

# Node Affinity керується тут (ключ + значення).
# Якщо values порожній, affinity не рендериться.
nodeAffinity:
  key: "kubernetes.io/hostname"
  values: []   # приклад: ["todo-kind-worker"]

# HPA параметри
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  averageUtilization:
    cpu: 60
    memory: 70

service:
  type: ClusterIP
  port: 8000

# PV/PVC — обсяги керуються з values.yaml (вимога ТЗ)
pv:
  capacity: "1Gi"
  hostPath: "/var/local-path-provisioner/todolist-pv"  # для kind/локально

pvc:
  requestsStorage: "1Gi"
